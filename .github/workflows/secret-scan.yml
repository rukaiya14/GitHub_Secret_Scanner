name: Secret Scanner

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git diff in PR mode
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run secret scanner (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          python scan_secrets.py --mode=pull_request --base-ref=${{ github.base_ref }}
      
      - name: Run secret scanner (Push)
        if: github.event_name == 'push'
        run: |
          python scan_secrets.py --mode=push
